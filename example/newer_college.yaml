   rows: 4
   cols: 4
   dt: f
   data: [0.7099216283860768, -0.7041416662469333, 0.013992691115502887, 0.015627525086609025,
         0.02460002682200807, 0.004936229792296243, -0.9996851866041602, -0.01981648043281047,
         0.703850921879071, 0.7100423561242176, 0.020826240168402843, -0.07544143005003269,
         0.0, 0.0, 0.0, 1.0]

## Transformation from camera to body-frame (imu)
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.709921628386077, 0.0246000268220081, 0.703850921879071, 0.0424926879816261,
