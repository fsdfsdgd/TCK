%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera.fx: 431.3873911369959
Camera.fy: 430.2496176152663
Camera.cx: 427.4407802012019
Camera.cy: 238.52694867508183

Camera.k1: 0.007017508922248575
Camera.k2: -0.002598448110748391
Camera.p1: -0.0014755213248257705
Camera.p2: 0.0006640775125219394

# Camera resolution
Camera.width: 848
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# ouster imu
## Transformation from body to camera-frame (imu)
